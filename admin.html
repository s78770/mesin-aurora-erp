<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>try{if(localStorage.getItem('aurora_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESIN DAO · Aurora ERP · 관리자</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c1424">
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurora ERP">
</head>
<body data-page="admin">
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo-mark" src="assets/icons/icon-192.png" alt="MESIN DAO">
      <span>MESIN DAO</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-bottom">
      <nav class="sidebar-bottom-nav" id="sidebarBottomNav"></nav>
      <div class="sidebar-foot">Aurora ERP · v1.0</div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="burger" id="sidebarToggle" aria-label="메뉴 열기">☰</button>
      <div class="breadcrumb">MESIN DAO / <b id="breadcrumbLabel">관리자</b></div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="테마 전환">🌙</button>
      <div class="topbar-right">
        <span id="whoami" style="margin-right:10px;"></span>
        <button type="button" class="preset-btn" id="logoutBtn">로그아웃</button>
      </div>
    </header>

    <main class="page-content">

      <div class="company-wrap" id="loadingWrap">
        <div class="company-note">불러오는 중...</div>
      </div>

      <div class="company-wrap" id="pendingWrap" hidden>
        <div class="company-hero">
          <h2>⏳ 승인 대기 중</h2>
          <p>가입은 완료됐지만 아직 관리자 승인 전입니다. 승인되면 공지사항/FAQ를 관리할 수 있습니다.</p>
        </div>
      </div>

      <div class="company-wrap" id="userMgmtWrap" hidden>
        <div class="company-section-label">회원 승인 관리 (관리자 전용)</div>
        <div class="company-note" id="noPendingHint" hidden>승인 대기 중인 회원이 없습니다.</div>
        <div class="table-scroll" id="userTableWrap" hidden>
          <table class="p-table">
            <thead><tr><th>이메일</th><th>가입일</th><th>권한 부여</th></tr></thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="company-wrap" id="noticesWrap" hidden>
        <div class="company-section-label">공지사항 관리</div>
        <div class="calc" style="margin-top:0; margin-bottom:20px;">
          <div class="field"><label>제목</label><div class="input-row"><input type="text" id="noticeTitle" placeholder="공지 제목"></div></div>
          <div class="field" style="margin-bottom:10px;"><label>내용</label><div class="input-row"><input type="text" id="noticeBody" placeholder="공지 내용"></div></div>
          <button type="button" class="ppt-nav-btn" id="noticeAddBtn">+ 공지 등록</button>
        </div>
        <div id="noticeList"></div>
      </div>

      <div class="company-wrap" id="faqWrap" hidden>
        <div class="company-section-label">FAQ 관리</div>
        <div class="calc" style="margin-top:0; margin-bottom:20px;">
          <div class="field"><label>질문</label><div class="input-row"><input type="text" id="faqQuestion" placeholder="질문"></div></div>
          <div class="field" style="margin-bottom:10px;"><label>답변</label><div class="input-row"><input type="text" id="faqAnswer" placeholder="답변"></div></div>
          <button type="button" class="ppt-nav-btn" id="faqAddBtn">+ FAQ 등록</button>
        </div>
        <div id="faqList"></div>
      </div>

      <div class="foot">MESIN DAO · AURORA · 예시 자료 (실제 지급 조건은 공식 공지 기준)</div>
    </main>
  </div><!-- /main -->
</div><!-- /app -->
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="assets/sidebar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-client.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
